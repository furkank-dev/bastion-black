#  GUARDIAN
#
#  Kod ekseni tek aile (kehribar). Ayrim parlaklik x doygunluk x dar
#  ton araligiyla — tek eksende degil.
#  Chrome mor — imlec, kenarlik, secim. Sistem temasiyla koprü.
#  ANSI durust birakildi: yesil yesil, kirmizi kirmizi. git diff,
#  pytest, trivy ve semgrep bu ayrima bagli.
# ═══════════════════════════════════════════════════════════════════

